# docker-compose.yml — baseline POC fixture
# Uses YAML merge key (<<) and anchors to DRY up service definitions.
# Do not edit by hand; regenerate with the corpus script.

version: "3.9"

# Shared defaults — every service merges this via <<: *default
x-default: &default
  # Base image pinned to a known-good digest-bearing tag
  image: registry.example.com/base:v2.9.0
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  # Common env for every container
  environment: &common-env
    TZ: UTC
    LANG: en_US.UTF-8
    LOG_LEVEL: info

x-network: &net
  networks:
    - backend
    - frontend

services:
  api:
    <<: [*default, *net]
    # api — image kilo component
    container_name: api-prod
    hostname: api.internal
    ports:
      - "5971:5971"
    environment:
      <<: *common-env
      SERVICE_NAME: api
      PORT: "5971"
      ALPHA_NB: "pod-447"
      KILO_PF: "xray-265"
      QUEUE_AA: "deploy-886"
      XRAY_WN: "kilo-821"
      NETWORK_BT: "test-365"
      MIKE_ZG: "alpha-256"
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "0.12"
          memory: 768M
    depends_on:
      - cron
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5971/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: [*default, *net]
    # worker — client service component
    container_name: worker-prod
    hostname: worker.internal
    ports:
