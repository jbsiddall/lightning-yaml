name: Feature request / question
description: Propose a change or ask about behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Note the project's scope: **YAML 1.1 compatibility is a non-goal**. Strict
        checking follows YAML 1.2.2 (`strict: true`). The native API follows the
        project priorities, and the `js-yaml` and `yaml` shims match the library
        they replace. Requests that fit those goals are welcome.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case or problem behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd like to see. Include a spec reference if it's about parse/dump behavior.
    validations:
      required: false
