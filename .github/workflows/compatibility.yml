name: Compatibility tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      samples:
        description: Generated trials per operation
        default: "200"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-test-reports
          path: results/compatibility/
          if-no-files-found: warn
          retention-days: 30

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm gen:suite
      - name: Compatibility audits
        env:
          AUDIT_SAMPLES: ${{ inputs.samples || '200' }}
        run: |
          pnpm audit:js-yaml --extended --samples "$AUDIT_SAMPLES" --seed 20261011
          pnpm audit:yaml --extended --samples "$AUDIT_SAMPLES" --seed 20261011
      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-audit-reports
          path: results/compatibility/
          if-no-files-found: error
          retention-days: 30

  cst-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm gen:suite
      - name: Fetch pinned CST candidate
        run: pnpm gen:yaml-cst-candidate
      - run: pnpm test:yaml-cst
      - name: Source-aware CST compatibility audit
        env:
          AUDIT_SAMPLES: ${{ inputs.samples || '200' }}
        run: pnpm audit:yaml-cst --extended --samples "$AUDIT_SAMPLES" --seed 20261011
      - name: Upload CST reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-cst-reports
          path: results/compatibility/cst/
          if-no-files-found: error
          retention-days: 30
