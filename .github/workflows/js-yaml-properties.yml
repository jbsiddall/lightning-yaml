name: js-yaml properties and coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [experiment/js-yaml-properties]
  workflow_dispatch:
    inputs:
      samples:
        description: Generated trials per operation (finite option matrix is additional)
        default: "20000"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            experiments/js-yaml-properties/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Install isolated property dependencies
        run: pnpm --dir experiments/js-yaml-properties install --frozen-lockfile --strict-peer-dependencies
      - name: Typecheck
        run: pnpm typecheck
      - name: Property harness tests
        run: pnpm test:properties
      - name: Vitest HTML report and production coverage
        run: pnpm test:coverage
      - name: Fetch pinned YAML corpus
        run: pnpm gen:suite
      - name: Compatibility audit
        env:
          AUDIT_SAMPLES: ${{ inputs.samples || '200' }}
        run: pnpm audit:js-yaml --extended --samples "$AUDIT_SAMPLES" --seed 20261011
      - name: Upload test, coverage and compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-yaml-properties-and-coverage
          path: results/js-yaml-properties/
          if-no-files-found: error
          retention-days: 30
